name: Daily Scrape

on:
  schedule:
    # 错开 UTC 整点（最拥堵、易被丢弃），改到冷门分钟提升可靠性
    - cron: '23 0 * * *'   # UTC 00:23 = 北京时间 08:23
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        env:
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          AIHUBMIX_BASE_URL: https://api.aihubmix.com/v1
          AI_MODEL: deepseek-v4-flash
        run: python scraper/scrape.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: daily scrape $(date -u +%F)"
          git push
