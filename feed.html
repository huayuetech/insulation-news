<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>资讯流（时间线）| Insulation News</title>
  <link rel="stylesheet" href="feed.css" />
  <link rel="stylesheet" href="trial.css" />
</head>
<body>
  <header class="feed-topbar">
    <a class="back-link" href="index.html">&larr; 工作台</a>
    <div class="feed-brand">
      <span class="feed-brand-kicker">huayue · Insulation News</span>
      <h1>资讯流</h1>
    </div>
    <div class="mode-toggle" role="group" aria-label="信息范围">
      <button class="mode-btn" data-mode="featured">精选</button>
      <button class="mode-btn active" data-mode="all">全部</button>
    </div>
    <input id="feedSearch" type="search" placeholder="搜索国家、材料、标准..." autocomplete="off" />
    <button class="icon-button" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
      <span class="theme-icon" aria-hidden="true"></span>
    </button>
  </header>

  <div class="cat-bar" id="catBar"></div>

  <main class="timeline-wrap">
    <div class="timeline-meta" id="timelineMeta"></div>
    <div class="timeline" id="timeline"></div>
    <div class="empty-state" id="emptyState" hidden>
      <strong>没有匹配结果</strong>
      <span>换个关键词或切换到"全部"试试。</span>
    </div>
  </main>

  <script src="data/bundle.js"></script>
  <script src="feed.js"></script>
  <script src="trial.js"></script>
</body>
</html>
