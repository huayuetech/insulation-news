<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insulation News | huayue</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="trial.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <p class="brand-kicker">huayue</p>
          <h1>Insulation News</h1>
        </div>
      </div>

      <div class="top-actions">
        <div class="search-wrap">
          <input id="searchInput" type="search" placeholder="搜索国家、材料、标准、应用场景..." autocomplete="off" />
        </div>
        <div class="select-control">
          <label for="timeFilter">时间</label>
          <select id="timeFilter">
            <option value="all" selected>全部</option>
            <option value="today">今天</option>
            <option value="3">近 3 天</option>
            <option value="7">近 7 天</option>
            <option value="month">本月</option>
          </select>
        </div>
        <button class="icon-button" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
          <span class="theme-icon" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <div class="chip-bar" id="chipBar"></div>

    <main class="workspace">
      <aside class="sidebar" aria-label="国家筛选">
        <section class="country-filter-panel">
          <div class="panel-heading">
            <span>国家/地区</span>
            <button class="link-button" id="clearCountries">清除</button>
          </div>
          <div class="country-groups" id="countryGroups"></div>
        </section>
      </aside>

      <section class="feed-column">
        <div class="feed-toolbar">
          <div class="feed-title-area">
            <h2 id="feedTitle">精选</h2>
          </div>
          <div class="feed-meta">
            <span class="update-time" id="updateTime"></span>
            <span class="feed-count" id="feedCount"></span>
          </div>
        </div>

        <div class="stats-row" id="statsRow"></div>

        <div class="timeline" id="timeline"></div>

        <div class="empty-state" id="emptyState" hidden>
          <strong>没有匹配结果</strong>
          <span>换个分类、关键词或扩大时间范围试试。</span>
        </div>
      </section>

      <aside class="insight-rail" aria-label="侧边栏">
        <section class="brief-card" id="policyAlertCard">
          <div class="panel-heading">
            <span>政策预警</span>
            <span class="badge badge-red" id="alertCount">0</span>
          </div>
          <div class="alert-list" id="policyAlerts"></div>
        </section>

        <section class="brief-card" id="topicCard">
          <div class="panel-heading">
            <span>选题灵感</span>
            <strong>Tip</strong>
          </div>
          <div class="topic-list" id="topicList"></div>
        </section>
      </aside>
    </main>
  </div>

  <script src="data/bundle.js"></script>
  <script src="app.js"></script>
  <script src="trial.js"></script>
</body>
</html>
