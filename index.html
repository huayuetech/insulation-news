<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insulation News | huayue</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="trial.css" />
</head>
<body>
  <div class="app-shell">
    <main class="workspace">
      <aside class="sidebar" aria-label="筛选与菜单">
        <div class="side-brand">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <div>
            <p class="brand-kicker">huayue</p>
            <h1>Insulation News</h1>
          </div>
        </div>

        <nav class="view-nav" id="viewNav">
          <button class="view-item active" data-view="featured"><span class="view-icon">&#9733;</span>精选</button>
          <button class="view-item" data-view="all"><span class="view-icon">&#9776;</span>全部动态</button>
        </nav>

        <section class="side-section">
          <input id="searchInput" class="side-search" type="search" placeholder="搜索国家、材料、标准..." autocomplete="off" />
        </section>

        <section class="side-section">
          <div class="panel-heading"><span>时间范围</span></div>
          <select id="timeFilter" class="side-select">
            <option value="all" selected>全部</option>
            <option value="today">今天</option>
            <option value="3">近 3 天</option>
            <option value="7">近 7 天</option>
            <option value="month">本月</option>
          </select>
        </section>

        <section class="side-section">
          <div class="panel-heading">
            <span>国家/地区</span>
            <button class="link-button" id="clearCountries">清除</button>
          </div>
          <div class="combo" id="countryCombo">
            <input id="countrySearch" type="text" placeholder="搜索或选择国家..." autocomplete="off" />
            <div class="combo-dropdown" id="countryDropdown" hidden></div>
          </div>
          <div class="selected-countries" id="selectedCountries"></div>
        </section>

        <div class="side-scroll">
          <section class="side-section">
            <div class="panel-heading">
              <span>政策预警</span>
              <span class="badge badge-red" id="alertCount">0</span>
            </div>
            <div class="alert-list" id="policyAlerts"></div>
          </section>

          <section class="side-section">
            <div class="panel-heading">
              <span>选题灵感</span>
              <strong>Tip</strong>
            </div>
            <div class="topic-list" id="topicList"></div>
          </section>
        </div>

        <nav class="side-menu">
          <div id="trialMenu"></div>
          <button class="side-menu-item" id="themeToggle" type="button"><span class="side-menu-icon">&#9681;</span>切换深浅色</button>
        </nav>
      </aside>

      <section class="feed-column">
        <div class="chip-bar" id="chipBar"></div>
        <div class="feed-toolbar">
          <div class="feed-title-area">
            <h2 id="feedTitle">精选</h2>
          </div>
          <div class="feed-meta">
            <span class="update-time" id="updateTime"></span>
            <span class="feed-coverage" id="feedCoverage"></span>
            <span class="feed-count" id="feedCount"></span>
          </div>
        </div>

        <div class="timeline" id="timeline"></div>

        <div class="empty-state" id="emptyState" hidden>
          <strong>没有匹配结果</strong>
          <span>换个分类、关键词或扩大时间范围试试。</span>
        </div>
      </section>

    </main>
  </div>

  <script src="data/bundle.js"></script>
  <script src="app.js"></script>
  <script src="trial.js"></script>
</body>
</html>
